name: Render Quarto (calls shared workflow)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  call-shared-render:
    uses: ebpro/_quarto-utils/.github/workflows/render-quarto.yml@v1.0.13
    secrets: inherit
    with:
      profiles: 'notes,slides'
      utils-repo: 'ebpro/_quarto-utils'
      utils-ref: 'v1.1.0'
      output-path: '_output'
      deploy: true
